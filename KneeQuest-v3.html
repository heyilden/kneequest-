/* Knee Quest 2.0 - deterministic, independently testable planning and calendar core. */
const KQ = (() => {

  const uid = () => (globalThis.crypto?.randomUUID?.() || 'kq-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
  function validDate(s) {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return false;
    const d=new Date(s+'T12:00:00Z'); return !isNaN(d) && d.toISOString().slice(0,10)===s;
  }
  function dateKey(d=new Date(),tz='Europe/Luxembourg') {

  }
  function weekKey(date) {
    if(!validDate(date)) throw Error('Date invalide');
    const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10);

function start(a,now=Date.now(),rng=Math.random){if(a.phase==='finished')return a;if(a.phase==='ready'){a.phase='work';a.phaseRemaining=Math.min(a.remaining,a.config.work*1000);a.question=question(a.config,rng);a.questionRemaining=a.config.interval*1000;a.rounds++;}a.running=true;a.lastTick=now;return a;}
function pause(a,now=Date.now()){if(a.running)tick(a,now);a.running=false;a.lastTick=null;return a;}
function next(a,rng=Math.random){if(a.question&&!a.question.answered)a.skipped++;a.question=question(a.config,rng);a.questionRemaining=a.config.interval*1000;}
function answer(a,id){const q=a.question;if(!a.running||a.phase!=='work'||!q||q.answered)return {accepted:false};
 if(q.game==='memory'&&a.questionRemaining>(a.config.interval-q.revealSeconds)*1000)return {accepted:false};
 if(!q.options.some(o=>o.id===String(id)))return {accepted:false};
 if(q.game==='memory'){q.responses.push(String(id));if(id!==q.sequence[q.sequenceIndex]){q.correct=false;q.answered=true;}else{q.sequenceIndex++;if(q.sequenceIndex===q.sequence.length){q.correct=true;q.answered=true;}}}
 else{q.answered=true;q.correct=String(id)===q.target;}
 if(q.answered){a.answered++;if(q.correct)a.correct++;a.log.push({question:q.game,correct:q.correct});if(a.log.length>500)a.log.shift();}
 return {accepted:true,complete:q.answered,correct:q.correct};
}
function tick(a,now=Date.now(),rng=Math.random){
 if(!a.running||a.lastTick==null)return {changed:false};
 // Browser suspension must not consume an entire physical bout unseen.
 let delta=Math.max(0,now-a.lastTick);a.lastTick=now;
 if(delta>5000){a.running=false;a.lastTick=null;return {changed:true,suspended:true};}
 a.remaining=Math.max(0,a.remaining-delta);a.phaseRemaining=Math.max(0,a.phaseRemaining-delta);
 if(a.remaining<=0){a.phase='finished';a.running=false;a.lastTick=null;return {changed:true,finished:true};}
 if(a.phaseRemaining<=0){
  if(a.phase==='work'){if(a.question&&!a.question.answered)a.skipped++;a.phase='rest';a.phaseRemaining=Math.min(a.remaining,a.config.rest*1000);a.question=null;}
  else{a.phase='ready';a.phaseRemaining=Math.min(a.remaining,a.config.work*1000);a.running=false;a.lastTick=null;}
  return {changed:true};
 }
 if(a.phase==='work'){const old=a.questionRemaining;a.questionRemaining=Math.max(0,old-delta);if(a.questionRemaining<=0){next(a,rng);return {changed:true};}
  if(a.question?.game==='memory'&&old>(a.config.interval-a.question.revealSeconds)*1000&&a.questionRemaining<=(a.config.interval-a.question.revealSeconds)*1000)return {changed:true};}
 return {changed:false};
}
return {colors,games,movements,validate,question,create,start,pause,next,answer,tick};
})();

ng>Variante :</strong> ${esc(e.choice)}</p>`:''}${e.notes?`<p class="small">${esc(e.notes)}</p>`:''}${e.powerNote?`<div class="notice safe">${esc(e.powerNote)}</div>`:''}${e.bonusPending?`<div class="notice">${btn('bonus-open','Ouvrir le portail bonus','spark','primary')}</div>`:''}${e.needsReview?`<div class="notice red"><strong>Fiche a confirmer avant execution.</strong><br>${btn('edit-exercise','Identifier dans la bibliotheque','edit','small',`data-id="${e.id}"`)}</div>`:''}${e.caution?`<div class="notice">${esc(e.caution)}</div>`:''}<div class="flex-between"><label style="margin:0">Valide chaque serie toi-meme</label><span class="small">${e.setsDone} / ${e.dose.sets}</span></div><div class="series-dots">${Array.from({length:e.dose.sets},(_,i)=>`<span class="series-dot ${i<e.setsDone?'done':''}">${i<e.setsDone?I('check',16):i+1}</span>`).join('')}</div><div class="button-row">${btn('set-done',done?'Series validees':'Valider cette serie','check',done?'':'primary',done||a.pausedAt||e.needsReview||e.bonusPending||a.timer?.kind==='prep'?'disabled':'')}${e.setsDone?btn('undo-set','Annuler derniere','back','small ghost'):''}${btn('rest-timer','Chrono repos libre','clock','small ghost',a.pausedAt?'disabled':'')}</div>${btn('next-exercise',a.index===total-1?'Terminer et noter ma seance':'Exercice suivant','arrow','primary next-button',!done||a.pausedAt||e.needsReview||e.bonusPending||a.timer?.kind==='prep'?'disabled':'')}<div class="flex-between" style="margin-top:15px"><button class="text-link" data-action="skip-exercise">Passer cet exercice</button><button class="text-link" data-action="finish-early">Pause / urgence / arreter</button></div></div></section><div class="stack"><section class="panel timer-panel"><div class="panel-head"><h3>Ton chrono</h3>${tag('Aucun passage auto')}</div><div class="timer-circle ${a.timer?.running?'running':''}" id="timer-circle"><b id="timer-digits">${minutes(a.timer?.remaining??(e.dose.seconds||60))}</b><span id="timer-kind">${a.timer?.kind==='prep'?'PREPARATION AU REPOS':a.timer?.kind==='rest'?'Repos libre':'Temps de travail'}</span></div>${e.dose.seconds&&!a.timer?`<button type="button" class="btn primary wide ready-button" data-action="timer-ready" ${a.pausedAt||e.needsReview||e.bonusPending?'disabled':''}>${I('play',17)}Je suis pret</button><p class="form-help">Compte a rebours de preparation avant le chrono. Ne commence pas le maintien avant le signal.</p>`:''}<div class="timer-tools"><label for="timer-seconds" class="sr">Duree du chrono, secondes</label><input id="timer-seconds" type="number" min="1" max="3600" value="${e.dose.seconds||60}"><span class="small">s</span>${iconBtn('timer-toggle',a.timer?.running?'pause':'play',a.timer?.running?'Pause chrono':'Demarrer ou reprendre le chrono')}${iconBtn('timer-reset','refresh','Reinitialiser le chrono')}</div><div class="timer-done section-gap" id="timer-status" aria-live="polite">${a.timer?.finished?'Temps ecoule. Valide ta serie quand elle est terminee.':''}</div><p class="small" style="margin:8px 0 0">Pause chrono conserve les secondes de la serie, sans validation. Aucun exercice, aucune serie et aucun repos ne sont valides automatiquement.</p></section><section class="panel"><div class="panel-head"><h3>Dans ta seance</h3><span class="small">${finished} / ${total}</span></div><div class="session-queue">${a.items.map((x,i)=>`<div class="queue-item ${i===a.index?'active':''}"><span>${x.skipped?'--':x.setsDone>=x.dose.sets?'OK':String(i+1).padStart(2,'0')}</span>${esc(x.name)}${x.bonus?' &middot; bonus':''}</div>`).join('')}</div></section><section class="notice neutral" style="margin:0"><strong>Ecouter ton genou fait partie de la mission.</strong><br>En cas de gene inhabituelle, adapte ou arrete selon tes consignes. L'application ne diminue pas automatiquement les charges et ne juge pas ce qui est medicalement sur.</section></div></div></div>`;
}

}</section></div><section class="panel section-gap"><h2>Des rappels, sans fausse synchronisation.</h2><div class="grid2"><div><h3>Google Agenda / calendrier du telephone</h3><p class="small">Le bouton Google ouvre un evenement prerempli : valide sa creation et son rappel dans Google. Le fichier .ics contient un rappel 15 min avant, selon la prise en charge de ton calendrier.</p><p class="small"><strong>Important :</strong> un export .ics ou un bouton Google n'est pas une synchronisation. Une date deplacee ou supprimee ici doit aussi etre modifiee dans le calendrier externe. Une alerte de decalage te le rappelle.</p></div><div><h3>Rappels de l'application</h3><p class="small">Une alerte peut apparaitre 15 min avant tant que l'application est ouverte et que le navigateur l'autorise. Elle n'est pas fiable application fermee : utilise l'agenda pour ce cas.</p>${btn('enable-notifications',S.settings.reminders?'Desactiver les rappels ouverts':'Activer les rappels ouverts','bell','ghost')}</div></div>${S.externalCleanup?.length?`<div class="notice section-gap"><h3>Agenda externe a nettoyer</h3><p class="small">Ces rendez-vous ont ete retires ici. Supprime leur copie externe pour arreter les rappels.</p>${S.externalCleanup.map(e=>`<div class="mission-line"><div><strong>${esc(e.title)} [${e.id.slice(0,6)}]</strong><p class="small">${fmtDate(e.externalDate||e.date)} a ${e.time}</p><div class="button-row"><a class="btn small ghost" href="${esc(KQ.safeURL(e.googleLink||'')||'https://calendar.google.com/calendar/')}" target="_blank" rel="noopener noreferrer">Ouvrir mon agenda</a>${btn('cleanup-done','J\'ai supprime la copie','check','small',`data-id="${e.id}"`)}</div></div></div>`).join('')}</div>`:''}${events.some(e=>e.date<today())?`<details><summary class="small">Rendez-vous passes (${events.filter(e=>e.date<today()).length})</summary>${events.filter(e=>e.date<today()).slice(-12).reverse().map(eventRow).join('')}</details>`:''}</section></div>`;

function chartSVG(list){
 const H=240,W=640,left=36,right=18,top=20,bottom=35,w=W-left-right,h=H-top-bottom;
 if(!list.length)return `<div class="empty">${I('chart',38)}<h3>Le debut de ton histoire.</h3><p>Les courbes apparaitront apres ta premiere seance notee. Aucune donnee de demonstration n'est ajoutee.</p></div>`;
 const series=U.chart==='knee'?[{label:'Avant',color:'#bea9fb',get:s=>s.checkin?.knee},{label:'Apres',color:'#bbf280',get:s=>s.feedback?.knee},{label:'Suivi J+1 ou apres',color:'#ffca85',get:s=>s.nextDay?.knee}]:[{label:'Ressenti global',color:'#bbf280',get:s=>s.feedback?.overall},{label:'Effort ressenti',color:'#bea9fb',get:s=>s.feedback?.effort}];
 const x=i=>list.length===1?left+w/2:left+i/(list.length-1)*w,y=v=>top+h-(v/10)*h;
 let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolution des notes sur 10. Tableau accessible plus bas.">`;
 for(let n=0;n<=10;n+=2)svg+=`<path class="gridline" d="M${left} ${y(n)}H${W-right}"/><text x="13" y="${y(n)+4}">${n}</text>`;
 series.forEach(s=>{let seg=[];const draw=()=>{if(seg.length>1)svg+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;seg=[];};list.forEach((d,i)=>{const v=s.get(d);if(typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=10)seg.push(x(i)+','+y(v));else draw();});draw();list.forEach((d,i)=>{const v=s.get(d);if(typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=10)svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}"><title>${esc(fmtDate(d.date))} : ${s.label} ${v}/10</title></circle>`;});});
 list.forEach((d,i)=>{if(list.length<=8||i===0||i===list.length-1||i%Math.ceil(list.length/6)===0)svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtDate(d.date)}</text>`;});svg+='</svg><div class="legend">'+series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')+'</div>';return svg;
}
function filteredHistory(){const cutoff=U.range==='all'?'0000-00-00':KQ.plusDays(today(),-Number(U.range));return S.history.filter(s=>s.date>=cutoff).sort((a,b)=>(a.date+a.startedAt).localeCompare(b.date+b.startedAt));}

function modal(title,html,wide=false,context={}){previousFocus=document.activeElement;modalContext=context;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title" tabindex="-1">${title}</h2>${iconBtn('close-modal','x','Fermer la fenetre')}</div><div class="modal-body">${html}</div></section></div>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>$('#modal-title')?.focus());}
function closeModal(){if(!$('#modal-root').innerHTML)return;$('#modal-root').innerHTML='';document.body.style.overflow='';modalContext={};if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});}

 const e=old||{id:KQ.uid(),name:'',block:'bas',group:'quadriceps',pose:'stand',variants:{},bonus:false,approved:false,enabled:false,favorite:false,frequency:1,repeatAllowed:false,unilateral:false,sides:'not_specified',notes:'',equipment:'',image:'',video:'',custom:true,source:'personal',sourceURL:'',original:'Ajout personnel : aucun dosage issu de la fiche initiale.',importedVariants:{}};

nence a confirmer"],["not-applicable","Pas applicable a cette version du mouvement"]])}${checkField("power-confirmed","La technique rapide et son dosage ont ete confirmes pour moi.",e.powerInfo?.confirmed||false,"Une charge explicite, meme 0 kg ajoute, est requise pour activer cette modalite.")}<div class="fields2"><div><label class="check"><input name="unilateral" type="checkbox" ${e.unilateral?'checked':''}><span>Exercice unilateral</span></label><label for="ex-sides">Cote / comptage confirme avec le kine</label><select id="ex-sides" name="sides">${[['not_specified','Non precise dans la fiche'],['single','Un seul cote prescrit'],['both','Les deux cotes, selon consignes']].map(([v,t])=>`<option value="${v}" ${e.sides===v?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="ex-frequency">Frequence de tirage</label><select id="ex-frequency" name="frequency">${[[.35,'Moins souvent'],[1,'Normale'],[3,'Plus souvent']].map(([v,t])=>`<option value="${v}" ${Number(e.frequency)===v?'selected':''}>${t}</option>`).join('')}</select><label class="check"><input name="favorite" type="checkbox" ${e.favorite?'checked':''}><span>Favori</span></label></div></div><div class="fields2 section-gap"><div class="field"><label for="ex-pose">Schema indicatif</label><select id="ex-pose" name="pose">${Art.poses.map(p=>`<option value="${p}" ${e.pose===p?'selected':''}>${({stand:'Debout',hipthrust:'Hip thrust',bridge:'Pont de hanche','single-squat':'Squat unipodal',deadlift:'Deadlift',trap:'Trap bar',split:'Fente bulgare','split-band':'Fente + elastique',wall:'Chaise',band:'Pas elastiques',calf:'Elevation talon',balance:'Equilibre',slide:'Leg curl glisse',supine:'Allonge',crunch:'Crunch',twist:'Rotation assise',plank:'Planche','plank-knee':'Planche genoux',pushup:'Pompe',sideplank:'Planche laterale',abduction:'Abduction',adduction:'Adduction',clam:'Clamshell',prone:'Sur le ventre',bird:'Bird dog',step:'Marche',sitstand:'Assis-debout','curl-leg':'Flexion genou debout',curl:'Cu module (maintien statique)</span></label><div class="notice safe"><label class="check"><input name="approved" type="checkbox" ${e.approved?'checked':''}><span>J'ai confirme cet exercice, sa variante et ses dosages avec mon professionnel.</span></label><label class="check"><input name="enabled" type="checkbox" ${e.enabled?'checked':''}><span>Inclure cet exercice dans les tirages compatibles</span></label></div><div class="modal-actions">${old?btn('delete-exercise','Supprimer','trash','danger',`data-id="${e.id}"`):''}${btn('close-modal','Annuler','','ghost')}<button class="btn primary" type="submit">${I('save',17)}Enregistrer</button></div></form>`,true,{exercise:KQ.clone(e),isNew:!old});

function range(name,label,value=0,left='Aucune',right='Maximale'){return `<div class="field"><label class="range-label" for="${name}">${label}<output for="${name}" id="${name}-out">${value} / 10</output></label><input type="range" id="${name}" name="${name}" min="0" max="10" step="1" value="${value}" data-output="${name}-out"><div class="range-ends"><span>0 &middot; ${left}</span><span>10 &middot; ${right}</span></div></div>`;}
function startCheckin(){
 
 if(S.active){navigate('session');return;}if(S.dualActive){toast('Termine ou enregistre la double tache avant une seance.',true);return;}
 if(!S.draft){toast('Compose d\'abord une seance.',true);return;}
 if(!S.settings.resumeCleared){modal('Avant de demarrer',`<div class="notice">Ta reprise apres PRP doit etre confirmee par ton professionnel. La date de l'injection ne suffit pas a autoriser ces exercices.</div><p>Tu peux deja organiser ta bibliotheque, tes dates et tes dosages. Confirme les consignes dans les reglages apres avoir obtenu cet accord.</p><div class="modal-actions">${btn('go-settings','Ouvrir les autorisations','shield','primary')}</div>`);return;}
 if(!S.settings.modePermissions[S.draft.mode]){toast('Cette modalite n\'est pas autorisee dans tes reglages.',true);return;}
 if(S.draft.date!==today()){toast('Cette seance a ete tiree un autre jour. Refais le tirage pour appliquer les regles de la semaine actuelle.',true);return;}
 // Revalidate prepared cards against current permissions and working library.
 const blocked=S.draft.items.some(i=>{const e=S.exercises.find(e=>e.id===i.id);return !e||(!i.needsReview&&!KQ.eligible(e,S.draft.mode,S.draft.rules));});
 if(blocked){toast('Une fiche a change depuis le tirage. Genere une nouvelle seance.',true);return;}
 modal('Comment va ton genou avant de commencer ?',`<form id="checkin-form"><div class="notice safe"><label class="check"><input id="start-bonus" type="checkbox" name="withBonus" ${S.draft.rules?.bonusPolicy==='off'?'disabled':''}><span><strong>Proposer un bonus facultatif en fin de seance</strong><small>Un seul exercice bonus, dans une seule famille. Aucun bonus non valide ne sera active.</small></span></label><label for="start-bonus-block">Famille du bonus</label><select id="start-bonus-block" name="bonusBlock">${[['random','Surprise : une seule famille'],['bas','Bas du corps'],['gainage','Gainage'],['haut','Haut du corps']].map(([v,t])=>`<option value="${v}" ${S.draft.rules?.bonusBlock===v?'selected':''}>${t}</option>`).join('')}</select></div>${range('before-knee','Gene actuelle du genou',0)}<label class="check"><input type="checkbox" name="redflag"><span>Douleur inhabituelle importante, genou tres chaud / gonfle, fievre ou difficulte nouvelle a prendre appui.</span></label><p class="form-help">Ces signes necessitent un avis medical rapide plutot qu'une seance. Aucun score de douleur n'est une autorisation automatique de t'entrainer.</p>${S.settings.clearanceNote?`<div class="notice neutral"><strong>Mes consignes :</strong><br>${esc(S.settings.clearanceNote)}</div>`:''}<label class="check"><input type="checkbox" name="understood" required><span>Je respecte les exercices, charges, amplitudes et consignes qui m'ont ete donnes.</span></label><div class="modal-actions">${btn('close-modal','Pas maintenant','','ghost')}<button class="btn primary" type="submit">${I('play',17)}Demarrer</button></div></form>`);
}
function feedback(early=false){if(!S.active)return;const a=S.active;pauseWorkout();const allDone=a.items.filter(e=>!e.bonus).every(KQ.completedItem);const status=!early&&allDone?'completed':'adapted';
 modal('La mission se termine. Ton ressenti compte.',`<form id="feedback-form"><div class="notice safe">${status==='completed'?'Seance terminee.':'Seance adaptee ou interrompue : ecouter ton genou est une bonne decision.'} Le jeu recompense ton suivi, jamais la douleur ni la charge.</div><label>Globalement, comment cela s'est-il passe ?</label><input type="hidden" name="overall" id="overall-value" value=""><div class="mood-grid">${[[2,'Difficile','2'],[4,'Mitige','4'],[6,'Correct','6'],[8,'Bien','8'],[10,'Tres bien','10']].map(([n,t,face])=>`<button type="button" class="btn ghost" data-action="mood" data-value="${n}"><b>${face}<small>/10</small></b>${t}</button>`).join('')}</div><div class="section-gap">${range('after-knee','Gene du genou apres',a.checkin?.knee||0)}${range('effort','Effort ressenti',5,'Minimal','Maximal')}</div><div class="field"><label for="feedback-note">Ce que tu veux retenir</label><textarea id="feedback-note" name="note" maxlength="4000" placeholder="Mouvements sensibles, adaptations, confort..."></textarea></div><p class="form-help">Un suivi le lendemain apparaitra sur l'accueil. Tu peux aussi y revenir plus tard depuis Evolution.</p><div class="modal-actions">${btn('close-modal','Revenir a la seance','','ghost')}<button class="btn primary" type="submit">${I('save',17)}Enregistrer mon bilan</button></div></form>`,false,{status});
}
function nextday(id){const h=S.history.find(h=>h.id===id);if(!h)return;if(KQ.plusDays(h.date,1)>today()){toast('Le suivi sera disponible demain. Le ressenti de fin de seance est deja enregistre.');return;}

function helpDialog(){modal('Knee Quest 3 : ton terrain de jeu',`<div class="stack"><div><h3>Un standard, tes propres regles</h3><p>Le standard garde les sept exercices du haut a dosage fixe et les deux gainages, avec une rotation des exercices du bas. L onglet Regles permet de creer des profils independants, choisir les groupes, les blocs, les modalites et les criteres de rotation.</p></div><div><h3>Quick est vraiment raccourci</h3><p>Le moteur cherche une selection proche de 35 minutes avec les dosages enregistres. La duree est estimee, pas garantie. Il n y a plus de pause automatique a 35 minutes. Les series ne sont reduites que si tu actives explicitement cette option dans les regles.</p></div><div><h3>Le chrono attend ton signal</h3><p>Pour un exercice minute, appuie sur Je suis pret. Le decompte de preparation precede le travail. Le petit diable propose seulement des secondes de preparation supplementaires, que tu peux refuser. Pause conserve le temps restant. Jamais de passage automatique a un autre exercice.</p></div><div><h3>Un seul bonus</h3><p>La case au demarrage autorise la proposition d un bonus. Une carte speciale attend ensuite ton accord. Refuser ne retire aucun point. Un bonus doit disposer d un dosage et d une autorisation pour apparaitre.</p></div><div><h3>Double tache</h3><p>Quatre jeux cognitifs, une duree de 5 a 10 minutes et des mouvements simples approuves. Le telephone ne mesure ni la posture ni la qualite du mouvement. Les reponses et ton ressenti restent dans un journal separe. Aucun score n autorise une progression physique.</p></div><div><h3>Local et sauvegardable</h3><p>Aucun compte Google. Les donnees restent dans ce navigateur. Exporte regulierement un JSON dans Reglages et importe le JSON de la V2 pour changer de version. Une notification exige que l application reste ouverte.</p></div></div>`);}

function pauseTimer(){const t=S.active?.timer;if(t?.running){t.remaining=Math.max(0,(t.deadline-Date.now())/1000);t.running=false;t.deadline=null;}}
function pauseWorkout(){if(!S.active)return;if(!S.active.pausedAt)S.active.pausedAt=Date.now();pauseTimer();persist();}
function resumeWorkout(){const a=S.active;if(!a)return;if(a.pausedAt){a.pausedMs=(a.pausedMs||0)+Date.now()-a.pausedAt;a.pausedAt=null;}persist();}
function advanceExercise(){const a=S.active;if(!a)return;pauseTimer();a.timer=null;if(a.index<a.items.length-1){a.index++;persist();render();window.scrollTo({top:0,behavior:'instant'});bonusPortal();}else feedback(false);}
function timerStart(kind='work',forceDuration=null){
 const a=S.active;if(!a)return;if(a.pausedAt){toast('Reprends d abord la seance.');return;}
 const e=a.items[a.index];if(e.needsReview||e.bonusPending){toast('Confirme cet exercice avant de lancer le chrono.',true);return;}
 const old=a.timer;
 if(old&&!old.running&&!old.finished&&forceDuration==null){old.deadline=Date.now()+old.remaining*1000;old.running=true;persist();render();return;}
 const seconds=forceDuration??KQ.num($('#timer-seconds')?.value,e.dose.seconds||60);
 if(!Number.isFinite(seconds)||seconds<=0||seconds>3600){toast('Choisis une duree de 1 a 3600 secondes.',true);return;}
 if(kind!=='rest'&&e.dose.seconds){prepareTimer(seconds);return;}
 a.timer={kind:kind==='rest'?'rest':'work',remaining:seconds,total:seconds,deadline:Date.now()+seconds*1000,running:true,finished:false};persist();render();
}
function updateTimer(){
 const a=S.active;if(!a)return;if($('#session-time'))$('#session-time').textContent=minutes(duration(a));const t=a.timer;if(!t)return;
 if(t.running){t.remaining=Math.max(0,(t.deadline-Date.now())/1000);if(t.remaining<=0){
  if(t.kind==='prep'){const seconds=t.nextWorkSeconds||a.items[a.index].dose.seconds||60;a.timer={kind:'work',remaining:seconds,total:seconds,deadline:Date.now()+seconds*1000,running:true,finished:false};beep();persist();render();return;}
  t.running=false;t.finished=true;t.deadline=null;persist();beep();if($('#timer-status'))$('#timer-status').textContent='Temps ecoule. Valide ta serie quand elle est terminee.';$('#timer-circle')?.classList.remove('running');toast('Chrono termine. Aucun passage automatique.');const b=$('[data-action="timer-toggle"]');if(b){b.innerHTML=I('play',18);b.setAttribute('aria-label','Redemarrer le chrono');}
 }}
 if($('#timer-digits'))$('#timer-digits').textContent=minutes(Math.ceil(t.remaining));
 if($('#timer-kind'))$('#timer-kind').textContent=t.kind==='prep'?'PREPARATION AU REPOS':t.kind==='rest'?'Repos libre':'Temps de travail';
 $('#timer-circle')?.classList.toggle('preparing',t.kind==='prep');
}
function beep(){if(!S.settings.sound)return;try{AudioCtx=AudioCtx||new(window.AudioContext||window.webkitAudioContext)();AudioCtx.resume();const osc=AudioCtx.createOscillator(),gain=AudioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(660,AudioCtx.currentTime);gain.gain.setValueAtTime(.08,AudioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,AudioCtx.currentTime+.22);osc.connect(gain);gain.connect(AudioCtx.destination);osc.start();osc.stop(AudioCtx.currentTime+.25);}catch{}}
function confetti(){if(currentRule().fun.confetti===false||S.settings.reducedMotion||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=$('#confetti');for(let i=0;i<42;i++){const p=document.createElement('span');p.className='confetto';p.style.left=Math.random()*100+'%';p.style.background=['var(--accent)','var(--purple)','var(--warm)'][i%3];p.style.animationDelay=Math.random()*.6+'s';p.style.setProperty('--dx',(Math.random()-.5)*250+'px');layer.appendChild(p);setTimeout(()=>p.remove(),3400);}}
function download(name,data,type='application/json'){const b=new Blob([data],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}

 <details class="panel rule-section section-gap" open><summary>01 / Modalites et rotation</summary><div class="fields2 section-gap"><div>${multiSelect('rule-modes',r.modes,KQ.MODES.map(m=>[m,modes[m]]),'Modalites utilisees')}${checkField('autoRotate','Rotation automatique',r.autoRotate,'Elle concerne la prochaine seance, jamais un exercice en cours.')}${selectField('rotationWhen','Quand changer ?',r.rotationWhen,[['lower-complete','Quand tout le bas principal prevu est termine'],['any-lower','Des qu une serie du bas a ete validee'],['session-complete','Quand tous les exercices principaux sont termines'],['manual','Ne pas changer automatiquement']])}</div><div>${selectField('cycle','Ordre du cycle',r.cycle.join(','),[['force,power,endurance','Force > explosivite > endurance'],['force,endurance,power','Force > endurance > explosivite'],['endurance,force,power','Endurance > force > explosivite'],['endurance,power,force','Endurance > explosivite > force'],['power,force,endurance','Explosivite > force > endurance'],['power,endurance,force','Explosivite > endurance > force']])}${selectField('rotationScope','Historique pour la rotation',r.rotationScope,[['all','Toutes mes seances'],['profile','Seulement ce profil']])}<p class="form-help">Une interruption ne valide aucune serie. Sans bloc bas travaille, la rotation ne progresse pas. Les autorisations generales restent dans Reglages.</p></div></div></details>
 <details class="panel rule-section section-gap"><summary>02 / Repetitions, groupes et ordre</summary><div class="fields2 section-gap"><div>${checkField('antiSession','Eviter une seance identique deja terminee',r.antiSession)}${checkField('antiExercises','Eviter les exercices deja termines',r.antiExercises)}${checkField('antiGroups','Eviter les groupes deja termines',r.antiGroups)}${checkField('allowExceptions','Respecter les exceptions de repetition des fiches',r.allowExceptions)}${multiSelect('repeatBlocks',r.repeatBlocks,Object.entries(blocks),'Circuits concernes par les repetitions')}${selectField('repeatBasis','Quels groupes comparer ?',r.repeatBasis,[['dominant','Seulement le groupe dominant'],['all','Dominant + muscles et chaines associes']])}<p class="form-help">Comparer toutes les chaines est beaucoup plus restrictif. Le profil standard exclut le haut et le gainage de l anti-repetition car ils sont systematiques.</p></div><div>${selectField('historyScope','Periode de non-repetition',r.historyScope,[['week','Semaine du lundi au dimanche'],['days','Derniers jours glissants']])}${numField('historyDays','Nombre de jours (si glissants)',r.historyDays,1,60)}${selectField('shortage','Si le choix manque',r.shortage,[['block','Ne jamais reutiliser un groupe interdit'],['allow','Autoriser la repetition si aucun choix neuf']])}${selectField('order','Ordre des circuits',r.order.join(','),seq)}${selectField('choiceMode','Variantes (chaise, pompes...)',r.choiceMode,[['rotate','Priorite aux variantes non terminees cette semaine'],['random','Au hasard'],['first','Toujours la premiere variante de la fiche']])}</div></div></details>
 <details class="panel rule-section section-gap" open><summary>03 / Quick : une vraie selection raccourcie</summary><p class="small section-gap">Le moteur cherche une combinaison autour de ta cible. Il ne coupe pas une seance a cette heure et n accelere ni mouvement ni repos. Ces reglages ne s appliquent que si Quick est coche.</p><div class="grid3">${numField('quick-target','Cible en minutes',r.quick.target,10,120)}${numField('quick-tolerance','Marge en minutes',r.quick.tolerance,0,10)}${numField('quick-setCap','Plafond de series (0 = aucun)',r.quick.setCap,0,30)}</div>${checkField('quick-subsetFixed','Autoriser une selection dans les circuits fixes / manuels',r.quick.subsetFixed,'Necessaire pour raccourcir un haut du corps complet. Les fiches originales ne changent pas.')}<div class="grid3 section-gap">${BLOCKS_UI().map(b=>`<div class="quick-budget"><strong>${blocks[b]}</strong>${numField('quick-min-'+b,'Minimum d exercices',r.quick.min[b],0,20)}${numField('quick-max-'+b,'Maximum d exercices',r.quick.max[b],1,30)}</div>`).join('')}</div><p class="form-help">Un circuit inclus conserve au moins un exercice. Pour l omettre completement, decoche ce circuit dans un autre profil. Un plafond de series est une adaptation volontaire a valider avec ton kine.</p></details>

 <details class="panel rule-section section-gap"><summary>05 / Bonus et effets</summary><div class="grid3 section-gap">${selectField('bonusPolicy','Bonus',r.bonusPolicy,[['ask','Option a cocher au demarrage'],['off','Aucun bonus pour ce profil']])}${selectField('bonusBlock','Famille preferee',r.bonusBlock,[['random','Surprise : une seule famille'],...Object.entries(blocks)])}${numField('bonusPoints','XP cosmetiques pour le bonus termine',r.bonusPoints,0,30)}</div>${checkField('fun-confetti','Celebrations et pluie d etoiles',r.fun.confetti)}<p class="form-help">Jamais plus d un exercice bonus par seance. Son portail demande une confirmation au moment de le faire. Refuser ne retire rien. La reduction des animations est prioritaire.</p></details>
 <div class="control-strip rule-save"><div><strong>Modifie les regles, pas tes seances passees.</strong><span class="small">Enregistre avant de lancer un nouveau tirage.</span></div><button type="submit" class="btn primary">${I('save',17)}Enregistrer ce jeu de regles</button></div></form>

function BLOCKS_UI(){return ['bas','gainage','haut'];}
function rulesFromForm(fd){
 const old=S.rules.find(r=>r.id===fd.get('ruleId'));if(!old)throw Error('Profil introuvable.');const r=KQ.clone(old);
 r.name=String(fd.get('ruleName')||'').trim();r.description=String(fd.get('ruleDescription')||'');
 for(const b of BLOCKS_UI())r.blocks[b]={enabled:fd.has(b+'-enabled'),selection:fd.get(b+'-selection'),count:Number(fd.get(b+'-count')),groups:fd.getAll(b+'-groups'),ids:fd.getAll(b+'-ids'),modulation:fd.get(b+'-modulation')};
 for(const k of ['autoRotate','antiSession','antiExercises','antiGroups','allowExceptions'])r[k]=fd.has(k);
 for(const k of ['rotationWhen','rotationScope','repeatBasis','historyScope','shortage','choiceMode','bonusPolicy','bonusBlock'])r[k]=fd.get(k);
 r.modes=fd.getAll('rule-modes');r.cycle=String(fd.get('cycle')).split(',');r.order=String(fd.get('order')).split(',');r.repeatBlocks=fd.getAll('repeatBlocks');r.historyDays=Number(fd.get('historyDays'));r.bonusPoints=Number(fd.get('bonusPoints'));
 for(const k of ['target','tolerance','setCap'])r.quick[k]=Number(fd.get('quick-'+k));r.quick.subsetFixed=fd.has('quick-subsetFixed');
 for(const b of BLOCKS_UI())for(const k of ['min','max'])r.quick[k][b]=Number(fd.get('quick-'+k+'-'+b));
 for(const k of ['warmup','feedback','repSeconds','restDefault','transition','sideTransition'])r.timing[k]=Number(fd.get('timing-'+k));
 for(const k of ['countdown','devilChance','devilMin','devilMax'])r.timer[k]=Number(fd.get('timer-'+k));r.timer.devil=fd.has('timer-devil');r.fun.confetti=fd.has('fun-confetti');KQ.validRule(r);return r;
}
function bonusPortal(){
 const a=S.active,e=a?.items[a.index];if(!e?.bonus||!e.bonusPending)return;
 pauseTimer();modal('Portail bonus : a toi de choisir',`<div class="bonus-portal"><div class="portal-symbol">\u2726</div>${tag('EXERCICE BONUS','warm')}<h2>${esc(e.name)}</h2><p>${blocks[e.block]} &middot; ${doseText(e.dose)}</p><div class="bonus-art">${illustration(e)}</div><p>Une seule carte bonus dans cette seance. <strong>+${a.rules?.bonusPoints??15} XP</strong> cosmetiques si tu la termines. Aucun point perdu si tu refuses.</p><div class="button-row">${btn('bonus-accept','Je le fais','spark','primary')}${btn('bonus-decline','Pas aujourd hui','arrow','ghost')}</div><p class="form-help">Ne prolonge pas un effort inconfortable pour une recompense.</p></div>`,true);
}
function prepareTimer(seconds){
 const a=S.active;if(!a||a.pausedAt)return;const cfg=a.rules?.timer||currentRule().timer;
 if(cfg.devil&&Math.random()*100<cfg.devilChance){const extra=cfg.devilMin+Math.floor(Math.random()*(cfg.devilMax-cfg.devilMin+1));modal('Le diablotin a une proposition...',`<div class="devil-panel"><div class="devil-face">\uD83D\uDE08</div><h2>+ ${extra} secondes... avant le depart.</h2><p>Reste <strong>au repos</strong> pendant ces secondes de preparation. Ta serie reste strictement a <strong>${seconds} secondes</strong>.</p><div class="button-row">${btn('devil-accept','Pacte accepte','spark','primary',`data-seconds="${seconds}" data-extra="${extra}"`)}${btn('devil-decline','Pas cette fois','play','ghost',`data-seconds="${seconds}"`)}</div><p class="form-help">Aucun effort, aucune repetition ni charge supplementaire. Desactivable dans Regles.</p></div>`);}
 else beginPreparedTimer(seconds,0);
}
function beginPreparedTimer(seconds,extra=0){
 const a=S.active;if(!a||a.pausedAt)return;closeModal();const n=(a.rules?.timer?.countdown??5)+extra;
 a.timer=n>0?{kind:'prep',remaining:n,total:n,deadline:Date.now()+n*1000,running:true,finished:false,nextWorkSeconds:seconds,extra}:{kind:'work',remaining:seconds,total:seconds,deadline:Date.now()+seconds*1000,running:true,finished:false};persist();render();
}
function powerPanel(e){const p=e.powerInfo;if(!p)return '';
 return `<div class="notice ${p.status==='candidate'?'safe':'neutral'} power-note"><strong>${p.status==='candidate'?'Explosivite : variante technique proposee':p.status==='review'?'Explosivite : confirmation specifique necessaire':'Pas de conversion explosive automatique'}</strong><p>${esc(p.note)}</p><p class="form-help">${esc(p.origin||'')} Les nouvelles propositions ne sont pas des doses de ta fiche. Le profil Standard garde le haut fixe.</p>${sourceLink({source:'acsmPower'})}</div>`;
}
function dualPage(){
 const a=S.dualActive;if(a)return dualActivePage(a);const c=S.dualConfig;
 return `<div class="page"><div class="page-head"><div><div class="eyebrow">Orbit / laboratoire double tache</div><h1>Les jambes bougent.<br><em>L&#39;esprit joue.</em></h1><p>5 a 10 minutes, repos compris. La difficulte change le jeu mental, pas la charge physique.</p></div>${btn('dual-kit','Mon kit de balises','download','ghost')}</div><section class="dual-hero panel"><div class="dual-constellation">${KQDual.colors.map(t=>`<span style="--chip:${t.hex}">${t.glyph}</span>`).join('')}</div><div><h2>Un telephone. Un support stable.<br>Et quatre balises.</h2><p>Feuilles de couleur ou papier blanc numerote, ruban adhesif pour les fixer, chaise stable. Pas de capteur, pas de camera, pas de course contre la montre.</p></div></section>
 <form id="dual-form" class="section-gap"><div class="game-grid">${Object.entries(KQDual.games).map(([id,g])=>`<label class="game-option"><input type="radio" name="game" value="${id}" ${c.game===id?'checked':''}><span class="game-glyph">${g.icon}</span><strong>${g.name}</strong><small>${g.description}</small></label>`).join('')}</div><div class="settings-grid section-gap"><section class="panel"><h2>Ton mouvement associe</h2>${selectField('movement','Mouvement deja autorise pour moi',c.movement,Object.entries(KQDual.movements).map(([id,m])=>[id,m.name]))}<div id="movement-info" class="notice neutral">${movementInfo(c.movement)}</div><p class="form-help">Les jeux sont des creations Knee Quest a faire valider, pas un protocole medical. Sans validation d un mouvement, utilise seulement le jeu mental assis au repos.</p>${checkField('motorConfirmed','Ce mouvement et la double tache sont compatibles avec mes consignes.',false)}${checkField('mentalOnly','Jouer uniquement au jeu mental, assis au repos',false,'Aucun exercice moteur demande dans ce mode.')}${checkField('safeSpace','Telephone pose, environnement degage et appui stable a portee.',false)}</section><section class="panel"><h2>Le format</h2><div class="fields2">${numField('minutes','Minutes, repos inclus',c.minutes,5,10)}${numField('level','Niveau mental (1 a 3)',c.level,1,3)}${numField('work','Jeu par bloc (secondes)',c.work,10,60)}${numField('rest','Repos entre blocs (secondes)',c.rest,10,90)}${numField('interval','Une question environ toutes les (s)',c.interval,6,30)}</div>${checkField('speech','Lire les consignes a voix haute',c.speech,'Utilise une voix locale du navigateur si disponible. Aucun micro.')}
 <div class="notice safe">Aucun score de vitesse. Une erreur ne rajoute ni secondes ni effort. Si tu hesites, stabilise-toi ou assieds-toi avant de repondre.</div><button type="submit" class="btn primary wide">${I('play',17)}Preparer ma double tache</button></section></div></form>
 <section class="panel section-gap"><div class="panel-head"><h2>Ton carnet d explorations</h2>${tag(S.dualHistory.length+' sessions','purple')}</div>${S.dualHistory.length?S.dualHistory.slice().reverse().slice(0,8).map(h=>`<div class="mission-line"><span class="marker">${KQDual.games[h.game]?.icon||'\u2726'}</span><div><h3>${esc(KQDual.games[h.game]?.name||h.game)}</h3><p>${fmtDate(h.date)} &middot; ${minutes(h.duration)} &middot; ${h.correct}/${h.answered} reponses &middot; ${h.mentalOnly?'Jeu mental seul':'Double tache declaree'}</p></div>${btn('dual-history','Bilan','chart','small ghost',`data-id="${h.id}"`)}</div>`).join(''):'<p class="small">Tes resultats apparaitront ici et dans Evolution, separement des seances de renforcement. Ils ne mesurent ni ta stabilite ni l etat du genou.</p>'}</section></div>`;
}
function movementInfo(id){const m=KQDual.movements[id];return `<strong>Materiel :</strong> ${esc(m.equipment)}<br><br>${esc(m.instructions)}`;}
function dualQuestionHTML(a){
 const q=a.question;if(!q)return '';
 const reveal=q.game==='memory'&&a.questionRemaining>(a.config.interval-q.revealSeconds)*1000;
 let central=q.game==='memory'?(reveal?`<div class="memory-sequence">${q.sequence.map(id=>{const c=KQDual.colors.find(t=>t.id===id);return `<span style="color:${c.hex}">${c.glyph}<small>${c.number}</small></span>`;}).join('')}</div>`:`<strong class="memory-count">${q.sequenceIndex} / ${q.sequence.length}</strong>`):`<strong class="cognitive-target" style="color:${q.visual?.hex||'var(--text)'}">${q.game==='colors'?q.visual.glyph+' ':''}${esc(q.label)}</strong>`;
 return `<p class="cognitive-instruction">${esc(q.prompt)}</p>${central}<div class="answer-grid">${q.options.map(o=>`<button class="answer-tile" data-action="dual-answer" data-id="${o.id}" style="--answer-color:${o.hex||'var(--accent)'}" ${!a.running||q.answered||reveal?'disabled':''}>${o.glyph?`<span>${o.glyph}</span>`:''}<b>${esc(o.label)}</b></button>`).join('')}</div><div class="answer-feedback ${q.correct?'correct':''}" aria-live="polite">${q.answered?(q.correct?'Bien vu. Garde ton propre rythme.':'On essaie la suivante. Aucun malus.'):reveal?'Observe la sequence...':'Stabilite d abord. Tu peux passer une question.'}</div>`;
}
function dualActivePage(a){
 const g=KQDual.games[a.config.game],m=KQDual.movements[a.config.movement],finished=a.phase==='finished';
 return `<div class="page"><div class="page-head"><div><div class="eyebrow">Double tache / ${a.config.mentalOnly?'Jeu mental au repos':m.name}</div><h1>${g.name}</h1></div><div class="session-clock">${I('clock',18)}<b id="dual-total">${minutes(Math.ceil(a.remaining/1000))}</b></div></div>
 <div class="dual-play-layout"><section class="panel cognitive-stage ${a.phase}" id="cognitive-stage"><div class="flex-between">${tag(a.phase==='work'?'JEU':a.phase==='rest'?'REPOS':finished?'EXPEDITION NOTEE':'A TON SIGNAL','purple')}<span class="small">Bloc <b id="dual-block-time">${minutes(Math.ceil(a.phaseRemaining/1000))}</b></span></div>
 ${a.phase==='work'?dualQuestionHTML(a):a.phase==='rest'?`<div class="rest-orbit">${Art.robot()}</div><h2>Repose-toi, vraiment.</h2><p>Aucun mouvement demande. La prochaine manche attendra ton accord.</p>`:finished?`<div class="rest-orbit">${Art.robot()}</div><h2>Fin du format prevu.</h2><p>${a.correct} reponses correctes sur ${a.answered}. Pas de mesure automatique de ta posture.</p>${btn('dual-finish','Enregistrer mon ressenti','heart','primary')}`:`<div class="rest-orbit">${Art.robot()}</div><h2>Tu gardes la main.</h2><p>${a.rounds?'Prochain bloc disponible.':'Installe ton telephone et ton appui.'} Le chrono est arrete jusqu a ton signal.</p>${btn('dual-toggle','Je suis pret','play','primary')}`}
 ${!finished?`<div class="button-row dual-controls">${a.phase!=='ready'?btn('dual-toggle',a.running?'Pause':'Reprendre',a.running?'pause':'play','primary'):''}${a.phase==='work'?btn('dual-skip','Passer la question','arrow','ghost',!a.running?'disabled':''):''}${btn('dual-finish','Arreter et noter','save','ghost')}</div>`:''}</section>
 <aside class="stack"><section class="panel"><h3>${a.config.mentalOnly?'Mode assis au repos':m.name}</h3><div class="dual-pose">${Art.exercise(m.pose,m.name)}</div><p class="small">${a.config.mentalOnly?'Aucun mouvement impose. Ce resultat sera note comme jeu mental, pas comme exercice moteur.':esc(m.instructions)}</p><div class="notice neutral">Ne tiens pas le telephone en marchant. Aucun saut, aucun appui instable, aucune flexion profonde imposee. Arrete si un symptome inhabituel apparait.</div></section><section class="panel"><div class="grid2"><div class="dose-stat"><strong id="dual-correct">${a.correct}</strong><span>bonnes reponses</span></div><div class="dose-stat"><strong id="dual-answered">${a.answered}</strong><span>reponses donnees</span></div></div><p class="form-help">Sans camera ni capteur : l application enregistre les touches, pas le mouvement, la qualite du geste ou l equilibre.</p></section></aside></div></div>`;
}
function dualSpeak(){const a=S.dualActive;if(!a?.config.speech||!a.running||a.phase!=='work'||!a.question||a.question.id===U.spokenQuestion)return;U.spokenQuestion=a.question.id;
 try{const voices=speechSynthesis.getVoices();const local=voices.find(v=>v.lang.startsWith('fr')&&v.localService);if(!local){if(!U.voiceWarning){toast('Aucune voix francaise locale disponible : consignes visuelles conservees.');U.voiceWarning=true;}return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(a.question.game==='stroop'?'Choisis la couleur de l encre.':a.question.game==='memory'?'Memorise la sequence.':a.question.label);u.voice=local;u.lang='fr-FR';u.rate=.9;speechSynthesis.speak(u);}catch{}}
function tickDual(){const a=S.dualActive;if(!a)return;const res=KQDual.tick(a);if(res.changed){persist();if(U.route==='dual')render();if(res.finished)beep();}if(U.route==='dual'){$('#dual-total')&&($('#dual-total').textContent=minutes(Math.ceil(a.remaining/1000)));$('#dual-block-time')&&($('#dual-block-time').textContent=minutes(Math.ceil(a.phaseRemaining/1000)));}dualSpeak();}

function dualKit(){

async function handleAction(action,el){

 if(await v3Action(action,el))return;
 switch(action){
 case'go-builder':if(currentRule().autoRotate)U.genMode=KQ.autoMode(S.history,today(),allowedModes(),currentRule());navigate('builder');break;case'go-settings':navigate('settings');break;case'go-planning':navigate('planning');break;case'go-library':navigate('library');break;
